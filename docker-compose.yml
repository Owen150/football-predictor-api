services:

  postgres:
    image: postgres:17
    container_name: football-predictor-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: football_predictor
      POSTGRES_USER: football_user
      POSTGRES_PASSWORD: football_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: